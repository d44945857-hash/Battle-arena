<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#dc2626" stroke-width="4" stroke-opacity="0.5"/>
  
  <!-- Outer glowing esports flame emblem -->
  <g transform="translate(256, 240) scale(1.1)" filter="url(#glow)">
    <path d="M0 -150 C40 -90, 110 -30, 110 50 C110 120, 60 170, 0 170 C-60 170, -110 120, -110 50 C-110 -30, -40 -90, 0 -150 Z" fill="url(#flame)" />
    <!-- Inner Flame -->
    <path d="M0 -90 C25 -50, 60 -10, 60 40 C60 85, 30 115, 0 115 C-30 115, -60 85, -60 40 C-60 -10, -25 -50, 0 -90 Z" fill="#ffffff" opacity="0.9" />
  </g>
  
  <!-- Text FF BATTLE -->
  <text x="256" y="440" font-family="'Outfit', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">FF ARENA</text>
</svg>
